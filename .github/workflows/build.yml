name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for Android SDK tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install legacy build-tools & platform
        run: |
          sdkmanager "platforms;android-23" "build-tools;23.0.3"

      - name: Set up JDK 8 (for Gradle 3.5 build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Gradle 3.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-3.5-bin.zip -O /tmp/gradle-3.5.zip
          unzip -q /tmp/gradle-3.5.zip -d /opt
          echo "/opt/gradle-3.5/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: itdo-legacy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
