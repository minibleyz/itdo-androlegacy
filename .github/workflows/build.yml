name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /opt/android-sdk-legacy
      ANDROID_HOME: /opt/android-sdk-legacy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download fresh cmdline-tools into isolated SDK dir
        run: |
          mkdir -p /opt/android-sdk-legacy/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk-legacy/cmdline-tools
          mv /opt/android-sdk-legacy/cmdline-tools/cmdline-tools /opt/android-sdk-legacy/cmdline-tools/latest

      - name: Install only required platform & build-tools
        run: |
          yes | /opt/android-sdk-legacy/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk-legacy "platforms;android-28" "build-tools;28.0.3" "platform-tools"

      - name: Set up JDK 8 (for Gradle 4.10.2 build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Gradle 4.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.2-bin.zip -O /tmp/gradle-4.10.2.zip
          unzip -q /tmp/gradle-4.10.2.zip -d /opt
          echo "/opt/gradle-4.10.2/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: itdo-legacy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
