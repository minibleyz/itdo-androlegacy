name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /opt/android-sdk-legacy
      ANDROID_HOME: /opt/android-sdk-legacy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download legacy SDK Tools 25.2.5 (writes old-schema package.xml)
        run: |
          mkdir -p /opt/android-sdk-legacy
          wget -q https://dl.google.com/android/repository/tools_r25.2.5-linux.zip -O /tmp/tools.zip
          unzip -q /tmp/tools.zip -d /opt/android-sdk-legacy

      - name: Install platform & build-tools via legacy sdkmanager
        run: |
          yes | /opt/android-sdk-legacy/tools/bin/sdkmanager "platforms;android-28" "build-tools;28.0.3" "platform-tools"

      - name: Download Gradle 4.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.2-bin.zip -O /tmp/gradle-4.10.2.zip
          unzip -q /tmp/gradle-4.10.2.zip -d /opt
          echo "/opt/gradle-4.10.2/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: itdo-legacy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
