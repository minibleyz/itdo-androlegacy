apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    buildToolsVersion "28.0.3"

    defaultConfig {
        applicationId "ru.itdo.app.legacy"
        minSdkVersion 14
        targetSdkVersion 23
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}

configurations.all {
    resolutionStrategy {
        // okhttp 3.13+ и retrofit 2.5+ используют Java 8 байткод (invoke-dynamic,
        // static/default interface methods), несовместимый без десугаринга с minSdk < 24/26.
        // Фиксируем последние версии из "чистой Java 7" эпохи.
        force 'com.squareup.okhttp3:okhttp:3.12.13'
        force 'com.squareup.retrofit2:retrofit:2.4.0'
    }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:23.4.0'
    implementation 'com.android.support:design:23.4.0'
    implementation 'com.android.support:recyclerview-v7:23.4.0'
    implementation 'com.android.support:cardview-v7:23.4.0'

    // Сеть — легаси, совместимо с очень старыми API (без OkHttp 4.x / Retrofit 2.5+, им нужен Java 8 / API 21+)
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.squareup.retrofit2:retrofit:2.4.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.4.0'

    testImplementation 'junit:junit:4.12'
}
